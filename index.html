<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mr Descargaelputotema</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root{
  --bg:#0a0a0f; --panel:#13131d; --panel-2:#1c1c2a; --panel-3:#252535;
  --border:#2a2a3d; --text:#f0f0f8; --text-dim:#8a8aa0;
  --yt:#ff2244; --yt-dark:#cc0022; --sp:#00d95f; --sp-dark:#00a847;
  --gold:#ffcc00; --gold-dark:#cc9900; --danger:#ff2244;
}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);user-select:none;}
body{display:flex;flex-direction:column;position:relative;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9990;
  background-image:repeating-linear-gradient(0deg,transparent 0,transparent 2px,
    rgba(255,200,0,0.02) 2px,rgba(255,200,0,0.02) 3px);}
#app{flex:1;display:flex;flex-direction:column;overflow:hidden;zoom:1;}

/* TOP BAR */
.topbar{background:linear-gradient(180deg,#1a1a24,#0f0f18);
  padding:9px 14px;display:flex;align-items:center;gap:10px;
  border-bottom:2px solid var(--gold);position:relative;flex-shrink:0;}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:4px;
  background:repeating-linear-gradient(-45deg,var(--gold) 0,var(--gold) 8px,
    #0a0a0f 8px,#0a0a0f 16px);opacity:.75;}
.topbar-btn,.scale-ctrl button{background:var(--panel-2);border:1px solid var(--border);
  color:var(--text);padding:6px 13px;border-radius:6px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:.15s;}
.topbar-btn:hover,.scale-ctrl button:hover{background:var(--gold);color:#000;
  border-color:var(--gold);transform:translateY(-1px);}
.topbar-btn:active,.scale-ctrl button:active{transform:translateY(1px);}
#btn-support{background:linear-gradient(135deg,#ff2d8f,#cc1177);color:#fff;
  border-color:#ff2d8f;font-weight:800;}
#btn-support:hover{background:linear-gradient(135deg,#ff44a0,#dd2288);
  color:#fff;box-shadow:0 0 12px rgba(255,45,143,0.6);}
.spacer{flex:1;}
.rec{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;
  color:#ff3355;letter-spacing:2px;padding:3px 8px;border:1px solid #ff3355;
  border-radius:4px;background:rgba(255,50,80,0.08);}
.rec-dot{width:7px;height:7px;background:#ff3355;border-radius:50%;
  animation:rec-blink 1.2s infinite;}
@keyframes rec-blink{0%,100%{opacity:1;box-shadow:0 0 6px #ff3355;}
  50%{opacity:.25;box-shadow:none;}}
.scale-ctrl{display:flex;align-items:center;gap:6px;font-size:11px;
  color:var(--text-dim);font-weight:600;}
.scale-ctrl b{color:var(--gold);font-size:12px;}
.scale-ctrl button{padding:4px 10px;font-size:14px;font-weight:800;min-width:32px;}

/* TABS */
.tabs{display:flex;gap:4px;padding:14px 14px 0;flex-shrink:0;}
.tab{padding:10px 24px;background:transparent;border:2px solid transparent;
  border-bottom:none;color:var(--text-dim);font-size:13px;font-weight:800;
  cursor:pointer;border-radius:10px 10px 0 0;font-family:inherit;
  text-transform:uppercase;letter-spacing:1px;transition:.2s;
  display:flex;align-items:center;gap:8px;}
.tab:hover{color:var(--text);transform:translateY(-1px);}
.tab.active{background:var(--panel);color:var(--gold);
  border-color:var(--border);transform:translateY(2px);}
.tab-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);}
.tab.active .tab-dot.yt{background:var(--yt);box-shadow:0 0 8px var(--yt);}
.tab.active .tab-dot.sp{background:var(--sp);box-shadow:0 0 8px var(--sp);}
.tab[data-tab="yt"].active .tab-dot{background:var(--yt);}
.tab[data-tab="sp"].active .tab-dot{background:var(--sp);}

/* CONVERTER */
.converter{flex:1 1 auto;min-height:180px;background:var(--panel);
  margin:0 14px;border:1px solid var(--border);border-radius:14px;
  padding:20px 22px;display:flex;flex-direction:column;
  overflow-y:auto;position:relative;transition:background .2s;}
.converter::-webkit-scrollbar{width:6px;}
.converter::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.panel{display:none;flex-direction:column;gap:14px;}
.panel.active{display:flex;}

.field-label{font-size:11px;color:var(--text-dim);font-weight:800;
  text-transform:uppercase;letter-spacing:1.5px;}
input[type="text"]{width:100%;padding:13px 15px;background:var(--panel-2);
  border:2px solid var(--border);border-radius:10px;color:var(--text);
  font-size:14px;outline:none;font-family:inherit;transition:.2s;}
input[type="text"]:focus{border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,204,0,0.15);}
select{width:100%;padding:12px 14px;background:var(--panel-2);
  border:2px solid var(--border);border-radius:10px;color:var(--text);
  font-size:14px;outline:none;cursor:pointer;font-family:inherit;
  appearance:none;}
select:focus{border-color:var(--gold);}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.col{flex:1;display:flex;flex-direction:column;gap:6px;min-width:150px;}

.segment{display:flex;background:var(--panel-2);border-radius:10px;
  padding:4px;border:2px solid var(--border);gap:3px;}
.segment button{flex:1;padding:10px;background:transparent;border:none;
  color:var(--text-dim);font-size:12px;font-weight:800;border-radius:7px;
  cursor:pointer;transition:.2s;font-family:inherit;
  text-transform:uppercase;letter-spacing:.5px;}
.segment button.active{background:var(--gold);color:#000;
  box-shadow:0 0 12px rgba(255,204,0,0.4);}

.checkbox{display:flex;align-items:center;gap:10px;cursor:pointer;
  font-size:12px;color:var(--text-dim);padding:4px 0;}
.checkbox input{display:none;}
.checkbox .box{width:20px;height:20px;border:2px solid var(--border);
  border-radius:6px;position:relative;flex-shrink:0;transition:.2s;}
.checkbox input:checked + .box{background:var(--gold);border-color:var(--gold);}
.checkbox input:checked + .box::after{content:'✓';position:absolute;color:#000;
  font-size:14px;font-weight:900;left:50%;top:50%;
  transform:translate(-50%,-55%);}

.btn-download{padding:16px;border:none;border-radius:12px;color:#fff;
  font-size:14px;font-weight:900;cursor:pointer;letter-spacing:1.5px;
  text-transform:uppercase;font-family:inherit;margin-top:auto;
  box-shadow:0 4px 0 rgba(0,0,0,0.5);transition:.15s;}
.btn-download:hover:not(:disabled){transform:translateY(-2px);
  box-shadow:0 6px 0 rgba(0,0,0,0.5);}
.btn-download:active:not(:disabled){transform:translateY(2px);
  box-shadow:0 2px 0 rgba(0,0,0,0.5);}
.btn-download.yt{background:linear-gradient(135deg,var(--yt),var(--yt-dark));}
.btn-download.sp{background:linear-gradient(135deg,var(--sp),var(--sp-dark));}
.btn-download:disabled{opacity:.55;cursor:not-allowed;}
.hint{font-size:11px;color:var(--text-dim);font-style:italic;}

/* SPLITTER */
.splitter{height:10px;margin:6px 14px;cursor:row-resize;
  flex-shrink:0;position:relative;}
.splitter::before{content:'';position:absolute;left:40%;right:40%;top:50%;
  height:3px;background:var(--border);transform:translateY(-50%);
  border-radius:2px;transition:all .15s;}
.splitter:hover::before{background:var(--gold);left:30%;right:30%;}

/* TERMINAL */
.terminal{flex:0 0 170px;margin:0 14px 6px;background:#05050a;
  border:1px solid var(--border);border-radius:10px;display:flex;
  flex-direction:column;overflow:hidden;}
.terminal-header{padding:6px 12px;background:var(--panel-2);
  border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;font-size:10px;
  font-weight:800;letter-spacing:2px;color:var(--text-dim);flex-shrink:0;}
.terminal-header button{background:transparent;border:none;color:var(--text-dim);
  cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px;font-family:inherit;}
.terminal-header button:hover{background:var(--danger);color:#fff;}
.log{flex:1;overflow-y:auto;padding:8px 12px;font-family:'Consolas',monospace;
  font-size:11px;line-height:1.5;color:#9a9ab0;user-select:text;}
.log::-webkit-scrollbar{width:6px;}
.log::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.log-entry{padding:1px 0;user-select:text;animation:log-in .25s ease-out;}
@keyframes log-in{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:none;}}
.log-entry.err{color:#ff5577;}
.log-entry.ok{color:#44dd88;}

/* STATUS */
.statusline{padding:6px 16px;display:flex;justify-content:space-between;
  align-items:center;font-size:12px;flex-shrink:0;}
.status-text{color:var(--text-dim);font-style:italic;}
.status-text.success{color:#4ade80;font-style:normal;font-weight:700;
  animation:flicker-in .4s;}
.status-text.error{color:#f87171;font-style:normal;font-weight:700;}
.status-text.working{color:var(--gold);font-style:normal;font-weight:700;
  animation:flicker-in .6s infinite;}
.status-text.warning{color:#fb923c;font-style:normal;font-weight:700;}
@keyframes flicker-in{0%,100%{opacity:1;}50%{opacity:.6;}}
.show-terminal{color:var(--gold);cursor:pointer;font-size:11px;
  font-weight:700;display:none;text-decoration:underline;}
.show-terminal:hover{color:#ffe066;}

/* PROGRESS BAR */
.progress-bar{height:4px;background:var(--panel-2);margin:0 14px 10px;
  border-radius:2px;overflow:hidden;position:relative;flex-shrink:0;}
.progress-bar .fill{position:absolute;width:35%;height:100%;
  background:linear-gradient(90deg,var(--yt),var(--gold),var(--sp));
  border-radius:2px;opacity:0;transition:opacity .3s;}
.progress-bar.active .fill{opacity:1;animation:progress-slide 1.1s ease-in-out infinite;}
@keyframes progress-slide{0%{left:-35%;}100%{left:100%;}}

/* POLICE */
#police-layer{position:fixed;inset:0;pointer-events:none;z-index:8500;
  overflow:hidden;}
#police-img{position:absolute;bottom:-20px;right:10px;width:200px;height:auto;
  transform:translateY(110%) rotate(15deg);opacity:0;
  transition:transform .55s cubic-bezier(0.34,1.56,0.64,1),opacity .4s;
  filter:drop-shadow(0 0 25px rgba(0,0,0,0.9))
         drop-shadow(0 0 8px rgba(255,204,0,0.3));}
#police-img.visible{transform:translateY(-15%) rotate(-3deg);opacity:1;}
#police-img.leaving{transition:transform 1.6s ease-in,opacity 1.6s ease-in;
  transform:translateY(140%) rotate(-20deg);opacity:0;}

/* STARS */
#stars-layer{position:fixed;top:64px;right:16px;z-index:8600;
  display:flex;gap:2px;pointer-events:none;opacity:0;
  transition:opacity .4s;}
#stars-layer.visible{opacity:1;}
.star{font-size:30px;color:var(--gold);
  text-shadow:0 0 8px #ffaa00,2px 2px 0 #000,-1px -1px 0 #000;
  opacity:0;transform:scale(0) rotate(-180deg);}
#stars-layer.visible .star{animation:star-pop .4s cubic-bezier(0.34,1.56,0.64,1) forwards;}
#stars-layer.visible .star:nth-child(1){animation-delay:.05s;}
#stars-layer.visible .star:nth-child(2){animation-delay:.15s;}
#stars-layer.visible .star:nth-child(3){animation-delay:.25s;}
#stars-layer.visible .star:nth-child(4){animation-delay:.35s;}
#stars-layer.visible .star:nth-child(5){animation-delay:.45s;}
@keyframes star-pop{0%{opacity:0;transform:scale(0) rotate(-180deg);}
  70%{opacity:1;transform:scale(1.4) rotate(15deg);}
  100%{opacity:1;transform:scale(1) rotate(0);}}
#stars-layer.blink .star{animation:star-blink .35s ease-in-out 3;}
@keyframes star-blink{0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.15;transform:scale(.85);}}

/* WIZARD */
#wizard{position:fixed;inset:0;background:#05050a;z-index:9999;
  display:none;align-items:center;justify-content:center;overflow:hidden;}
#wizard.visible{display:flex;}
#wizard::before,#wizard::after{content:'';position:absolute;left:0;right:0;
  height:32px;background:repeating-linear-gradient(-45deg,var(--gold) 0,
    var(--gold) 20px,#0a0a0f 20px,#0a0a0f 40px);z-index:10;}
#wizard::before{top:0;}
#wizard::after{bottom:0;}
.wiz-slide{display:none;flex-direction:column;align-items:center;gap:22px;
  max-width:92%;max-height:92%;padding:20px;position:relative;z-index:5;}
.wiz-slide.active{display:flex;
  animation:ppt-enter .9s cubic-bezier(0.34,1.56,0.64,1) forwards;}
@keyframes ppt-enter{0%{transform:scale(0) rotate(-30deg);opacity:0;}
  50%{transform:scale(1.15) rotate(10deg);opacity:1;}
  75%{transform:scale(0.95) rotate(-5deg);}
  100%{transform:scale(1) rotate(0);opacity:1;}}
.wiz-slide img{max-width:100%;max-height:58vh;border-radius:12px;
  box-shadow:0 0 40px rgba(255,200,0,.3),0 10px 40px rgba(0,0,0,.85);}
.wiz-btn{padding:14px 34px;background:var(--gold);color:#000;border:none;
  border-radius:10px;font-size:14px;font-weight:900;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;font-family:inherit;
  box-shadow:4px 4px 0 rgba(0,0,0,.9);transition:.15s;}
.wiz-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(0,0,0,.9);
  background:#ffdd33;}
.wiz-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.9);}
.wiz-buttons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.wiz-yes{background:var(--sp);color:#fff;}
.wiz-yes:hover{background:#22ee77;}
.wiz-no{background:var(--danger);color:#fff;}
.wiz-no:hover{background:#ff3355;}
.wiz-check{display:flex;align-items:center;gap:10px;font-size:13px;
  color:var(--text-dim);cursor:pointer;padding:10px 16px;border-radius:8px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);}
.wiz-check input{width:18px;height:18px;cursor:pointer;accent-color:var(--gold);}

/* CONTEXT MENU */
#ctx-menu{position:fixed;background:var(--panel-2);border:2px solid var(--gold);
  border-radius:8px;padding:4px;display:none;z-index:10000;
  box-shadow:0 8px 24px rgba(0,0,0,.7);min-width:150px;}
#ctx-menu.visible{display:block;}
.ctx-item{padding:9px 14px;font-size:12px;cursor:pointer;border-radius:5px;
  color:var(--text);font-weight:600;}
.ctx-item:hover{background:var(--gold);color:#000;}

/* FOLDER MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);
  display:none;align-items:center;justify-content:center;z-index:9700;
  backdrop-filter:blur(5px);}
.modal-overlay.active{display:flex;}
.modal{background:var(--panel);border-radius:16px;padding:26px;
  max-width:460px;width:90%;border:2px solid var(--gold);
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 60px rgba(255,204,0,.15);
  animation:modal-in .35s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes modal-in{from{transform:scale(.7) rotate(-3deg);opacity:0;}
  to{transform:scale(1) rotate(0);opacity:1;}}
.modal h3{font-size:16px;margin-bottom:8px;color:var(--gold);}
.modal p{font-size:13px;color:var(--text-dim);margin-bottom:16px;line-height:1.5;}
.modal .path{background:var(--panel-2);padding:11px 13px;border-radius:8px;
  font-size:11px;font-family:'Consolas',monospace;color:#a5a5c0;
  word-break:break-all;margin-bottom:18px;border:1px solid var(--border);}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;}
.modal-actions button{flex:1;padding:12px 16px;border-radius:10px;border:none;
  cursor:pointer;font-size:12px;font-weight:800;transition:.15s;
  min-width:110px;font-family:inherit;text-transform:uppercase;letter-spacing:.5px;}
.btn-primary{background:var(--gold);color:#000;}
.btn-primary:hover{background:#ffdd33;}
.btn-secondary{background:var(--panel-2);color:var(--text);
  border:1px solid var(--border);}
.btn-secondary:hover{background:var(--panel-3);}
.btn-cancel{background:transparent;color:var(--text-dim);}
.btn-cancel:hover{color:var(--text);}

/* SUPPORT MODAL */
#support-modal .modal{max-width:520px;border-color:#ff2d8f;
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 60px rgba(255,45,143,.25);}
#support-modal h3{color:#ff2d8f;}
.support-options{display:flex;flex-direction:column;gap:10px;margin:18px 0 4px;}
.support-option{display:flex;align-items:center;gap:15px;padding:14px 16px;
  background:var(--panel-2);border:2px solid var(--border);border-radius:12px;
  text-decoration:none;color:var(--text);transition:all .2s ease;
  cursor:pointer;font-family:inherit;text-align:left;width:100%;}
.support-option:hover{background:var(--panel-3);border-color:#ff2d8f;
  transform:translateX(6px);box-shadow:0 0 20px rgba(255,45,143,.25);}
.support-icon{font-size:26px;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(255,45,143,.6));}
.support-option div{display:flex;flex-direction:column;gap:3px;}
.support-option strong{font-size:13px;color:var(--text);font-weight:800;}
.support-option span{font-size:11.5px;color:var(--text-dim);}

/* GLITCH */
@keyframes glitch-shake{0%,100%{transform:translate(0);filter:none;}
  20%{transform:translate(-3px,1px);filter:hue-rotate(20deg);}
  40%{transform:translate(3px,-2px);filter:hue-rotate(-20deg);}
  60%{transform:translate(-2px,2px);filter:hue-rotate(10deg);}
  80%{transform:translate(2px,-1px);filter:hue-rotate(-10deg);}}
.glitch{animation:glitch-shake .35s;}
@keyframes shake-anim{0%,100%{transform:translateX(0);}
  20%{transform:translateX(-7px);}40%{transform:translateX(7px);}
  60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.shake{animation:shake-anim .4s;}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <button class="topbar-btn" id="btn-downloads">📁 Abrir Downloads</button>
    <button class="topbar-btn" id="btn-support">💖 Apóyame</button>
    <div class="rec"><span class="rec-dot"></span>REC</div>
    <div class="spacer"></div>
    <div class="scale-ctrl">
      <span>🔍 Escala <b id="scale-val">100</b></span>
      <button id="btn-scale-minus">−</button>
      <button id="btn-scale-plus">+</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="yt"><span class="tab-dot yt"></span>YouTube</button>
    <button class="tab" data-tab="sp"><span class="tab-dot sp"></span>Spotify</button>
  </div>

  <div class="converter" id="converter">
    <div class="panel active" id="panel-yt">
      <label class="field-label">Enlace del video o playlist</label>
      <input type="text" id="yt-url" placeholder="https://www.youtube.com/watch?v=...">
      <label class="checkbox">
        <input type="checkbox" id="yt-playlist">
        <span class="box"></span>
        <span>Descargar playlist completa</span>
      </label>
      <div class="row">
        <div class="col">
          <label class="field-label">Tipo</label>
          <div class="segment" id="yt-type">
            <button class="active" data-type="audio">Audio (MP3)</button>
            <button data-type="video">Video (MP4)</button>
          </div>
        </div>
        <div class="col">
          <label class="field-label">Calidad</label>
          <select id="yt-quality">
            <option>320 kbps</option><option>192 kbps</option><option>128 kbps</option>
          </select>
        </div>
      </div>
      <button class="btn-download yt" id="yt-go">DESCARGAR DESDE YOUTUBE</button>
    </div>

    <div class="panel" id="panel-sp">
      <label class="field-label">Enlace de canción, álbum o playlist</label>
      <input type="text" id="sp-url" placeholder="https://open.spotify.com/track/...">
      <div class="row">
        <div class="col">
          <label class="field-label">Formato</label>
          <select id="sp-format">
            <option value="mp3">MP3</option><option value="flac">FLAC</option>
            <option value="opus">OPUS</option><option value="m4a">M4A</option>
          </select>
        </div>
      </div>
      <p class="hint">Se descarga en la mejor calidad disponible automáticamente.</p>
      <button class="btn-download sp" id="sp-go">DESCARGAR DESDE SPOTIFY</button>
    </div>
  </div>

  <div class="splitter" id="splitter"></div>

  <div class="terminal" id="terminal">
    <div class="terminal-header">
      <span>▸ TERMINAL</span>
      <button id="btn-close-terminal" title="Cerrar">✕</button>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="statusline">
    <span class="status-text" id="status">Listo.</span>
    <span class="show-terminal" id="show-terminal-btn">▸ Terminal</span>
  </div>

  <div class="progress-bar" id="progress"><div class="fill"></div></div>
</div>

<div id="police-layer">
  <img id="police-img" src="poli_busca.png" alt="">
</div>

<div id="stars-layer">
  <span class="star">★</span><span class="star">★</span><span class="star">★</span>
  <span class="star">★</span><span class="star">★</span>
</div>

<div id="wizard">
  <div class="wiz-slide active" data-step="1">
    <img src="slide1.png" alt="">
    <button class="wiz-btn">Click para continuar</button>
  </div>
  <div class="wiz-slide" data-step="2">
    <img src="slide2.png" alt="">
    <div class="wiz-buttons">
      <button class="wiz-btn wiz-no">No mío</button>
      <button class="wiz-btn wiz-yes">Sí mío</button>
    </div>
  </div>
  <div class="wiz-slide" data-step="3">
    <img src="slide3.png" alt="">
    <label class="wiz-check">
      <input type="checkbox" id="wiz-no-show">
      <span>No volver a mostrar nunca más</span>
    </label>
    <button class="wiz-btn wiz-open">Abrir Mr Descargaelputotema</button>
  </div>
</div>

<div id="ctx-menu">
  <div class="ctx-item" data-action="paste">Pegar</div>
  <div class="ctx-item" data-action="cut">Cortar</div>
  <div class="ctx-item" data-action="copy">Copiar</div>
  <div class="ctx-item" data-action="selall">Seleccionar todo</div>
</div>

<div class="modal-overlay" id="folder-modal">
  <div class="modal">
    <h3>📁 ¿Dónde quieres guardarlo?</h3>
    <p>Puedes usar la carpeta por defecto o elegir otra ubicación.</p>
    <div class="path" id="modal-path"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="modal-default">Carpeta por defecto</button>
      <button class="btn-secondary" id="modal-choose">Elegir otra…</button>
      <button class="btn-cancel" id="modal-cancel">Cancelar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="support-modal">
  <div class="modal">
    <h3>💖 Apóyame</h3>
    <p>Puedes apoyarme de las siguientes formas:</p>
    <div class="support-options">
      <button class="support-option" id="support-donate">
        <span class="support-icon">☕</span>
        <div>
          <strong>Donándome la cantidad que consideres</strong>
          <span>Invítame a un café (Ko-fi)</span>
        </div>
      </button>
      <button class="support-option" id="support-mixing">
        <span class="support-icon">🎧</span>
        <div>
          <strong>Contratando mis servicios de Mezcla y Mastering</strong>
          <span>@aimo.247 (Instagram)</span>
        </div>
      </button>
      <button class="support-option" id="support-music">
        <span class="support-icon">🎵</span>
        <div>
          <strong>Apoyando mi carrera musical</strong>
          <span>@ftr.aimo (Instagram)</span>
        </div>
      </button>
    </div>
    <div class="modal-actions" style="margin-top: 18px;">
      <button class="btn-cancel" id="support-close">Cerrar</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let defaultFolder = "";
let pendingAction = null;
let isDownloading = false;
let currentScale = 100;
let pyApi = null;

function addLog(msg, kind){
  const log = $('log');
  const t = new Date().toLocaleTimeString('es-ES',{hour12:false});
  const d = document.createElement('div');
  d.className = 'log-entry' + (kind ? ' ' + kind : '');
  d.textContent = `[${t}] ${msg}`;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function setStatus(msg, kind){
  const el = $('status');
  el.textContent = msg;
  el.className = 'status-text' + (kind ? ' ' + kind : '');
}
function setProgress(active){
  $('progress').classList.toggle('active', active);
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    $('panel-' + tab.dataset.tab).classList.add('active');
    const c = $('converter');
    c.classList.remove('glitch');
    void c.offsetWidth;
    c.classList.add('glitch');
  });
});

// Type audio/video
document.querySelectorAll('#yt-type button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#yt-type button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const sel = $('yt-quality');
    sel.innerHTML = '';
    const opts = btn.dataset.type === 'audio'
      ? ['320 kbps','192 kbps','128 kbps']
      : ['Mejor disponible','1080p','720p','480p','360p'];
    opts.forEach(o => sel.innerHTML += `<option>${o}</option>`);
  });
});

// Scale
function applyScale(v){
  currentScale = Math.max(70, Math.min(150, v));
  $('app').style.zoom = currentScale / 100;
  $('scale-val').textContent = currentScale;
}
$('btn-scale-minus').onclick = () => applyScale(currentScale - 5);
$('btn-scale-plus').onclick = () => applyScale(currentScale + 5);

// Splitter
let isDrag = false, startY = 0, startH = 0;
$('splitter').addEventListener('mousedown', e => {
  isDrag = true; startY = e.clientY;
  startH = $('converter').offsetHeight;
  document.body.style.cursor = 'row-resize';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!isDrag) return;
  const delta = e.clientY - startY;
  const h = Math.max(120, startH + delta);
  $('converter').style.flex = `0 0 ${h}px`;
});
document.addEventListener('mouseup', () => {
  if (isDrag){ isDrag = false; document.body.style.cursor = ''; }
});

// Terminal close
$('btn-close-terminal').onclick = () => {
  $('terminal').style.display = 'none';
  $('splitter').style.display = 'none';
  $('show-terminal-btn').style.display = 'inline-block';
};
$('show-terminal-btn').onclick = () => {
  $('terminal').style.display = 'flex';
  $('splitter').style.display = 'block';
  $('show-terminal-btn').style.display = 'none';
  $('converter').style.flex = '1 1 auto';
};

// Context menu
const ctx = $('ctx-menu');
document.addEventListener('contextmenu', e => {
  const t = e.target;
  if (t.tagName === 'INPUT' && t.type === 'text'){
    t.focus();
    e.preventDefault();
    ctx.style.left = e.clientX + 'px';
    ctx.style.top = e.clientY + 'px';
    ctx.classList.add('visible');
    ctx.dataset.target = 'input';
  } else if (t.closest('.log')){
    e.preventDefault();
    ctx.style.left = e.clientX + 'px';
    ctx.style.top = e.clientY + 'px';
    ctx.classList.add('visible');
    ctx.dataset.target = 'log';
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('#ctx-menu')) ctx.classList.remove('visible');
});
ctx.querySelectorAll('.ctx-item').forEach(item => {
  item.addEventListener('click', async () => {
    const act = item.dataset.action;
    if (ctx.dataset.target === 'input'){
      const inp = document.activeElement;
      if (inp && inp.tagName === 'INPUT'){
        if (act === 'paste'){
          const txt = await pyApi.get_clipboard();
          const s = inp.selectionStart || 0, en = inp.selectionEnd || 0;
          inp.value = inp.value.slice(0,s) + txt + inp.value.slice(en);
          inp.selectionStart = inp.selectionEnd = s + txt.length;
          inp.dispatchEvent(new Event('input'));
        } else if (act === 'cut'){
          const s = inp.selectionStart || 0, en = inp.selectionEnd || 0;
          if (s !== en){ navigator.clipboard.writeText(inp.value.slice(s,en));
            inp.value = inp.value.slice(0,s) + inp.value.slice(en); }
        } else if (act === 'copy'){
          const s = inp.selectionStart || 0, en = inp.selectionEnd || 0;
          if (s !== en) navigator.clipboard.writeText(inp.value.slice(s,en));
        } else if (act === 'selall'){ inp.select(); }
      }
    } else if (ctx.dataset.target === 'log'){
      if (act === 'copy'){ navigator.clipboard.writeText(window.getSelection().toString()); }
      else if (act === 'selall'){
        const r = document.createRange(); r.selectNodeContents($('log'));
        const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      }
    }
    ctx.classList.remove('visible');
  });
});

// Folder modal
function askFolder(cb){
  $('modal-path').textContent = defaultFolder;
  $('folder-modal').classList.add('active');
  pendingAction = cb;
}
$('modal-default').onclick = () => {
  $('folder-modal').classList.remove('active');
  if (pendingAction) pendingAction(defaultFolder);
  pendingAction = null;
};
$('modal-choose').onclick = async () => {
  $('folder-modal').classList.remove('active');
  const chosen = await pyApi.choose_folder();
  if (chosen && pendingAction) pendingAction(chosen);
  pendingAction = null;
};
$('modal-cancel').onclick = () => {
  $('folder-modal').classList.remove('active');
  pendingAction = null;
};

// Support modal
const supportModal = $('support-modal');
$('btn-support').onclick = () => {
  supportModal.classList.add('active');
};
$('support-close').onclick = () => {
  supportModal.classList.remove('active');
};
supportModal.addEventListener('click', (e) => {
  if (e.target === supportModal) supportModal.classList.remove('active');
});

$('support-donate').onclick = (e) => {
  e.preventDefault();
  pyApi.open_url('https://ko-fi.com/aimo247');
};
$('support-mixing').onclick = (e) => {
  e.preventDefault();
  pyApi.open_url('https://instagram.com/aimo.247');
};
$('support-music').onclick = (e) => {
  e.preventDefault();
  pyApi.open_url('https://instagram.com/ftr.aimo');
};

// Police
function showPolice(){
  const p = $('police-img');
  p.src = 'poli_busca.png';
  p.classList.remove('leaving');
  requestAnimationFrame(() => p.classList.add('visible'));
  $('stars-layer').classList.add('visible');
}
function hidePolice(success){
  const p = $('police-img');
  const s = $('stars-layer');
  if (success){
    s.classList.add('blink');
    setTimeout(() => { p.src = 'poli_confuso.png'; }, 900);
    setTimeout(() => {
      s.classList.remove('visible','blink');
      p.classList.add('leaving');
      setTimeout(() => p.classList.remove('visible','leaving'), 1700);
    }, 3000);
  } else {
    s.classList.remove('visible');
    p.classList.add('leaving');
    setTimeout(() => p.classList.remove('visible','leaving'), 1700);
  }
}

function shakeInput(id){
  const el = $(id);
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}

// YouTube
$('yt-go').onclick = () => {
  if (isDownloading) return;
  const url = $('yt-url').value.trim();
  if (!url){ addLog("Pega primero un enlace.", "err"); shakeInput('yt-url'); return; }
  if (!/^https?:\/\//.test(url)){ addLog("URL inválida.", "err"); shakeInput('yt-url'); return; }
  const typeBtn = document.querySelector('#yt-type button.active');
  const isAudio = typeBtn.dataset.type === 'audio';
  const quality = $('yt-quality').value;
  const isPlaylist = $('yt-playlist').checked;
  askFolder(folder => {
    isDownloading = true;
    $('yt-go').disabled = true;
    showPolice();
    pyApi.download_youtube(url, isAudio, quality, isPlaylist, folder);
  });
};

// Spotify
$('sp-go').onclick = () => {
  if (isDownloading) return;
  const url = $('sp-url').value.trim();
  if (!url){ addLog("Pega primero un enlace.", "err"); shakeInput('sp-url'); return; }
  if (!/^https?:\/\//.test(url)){ addLog("URL inválida.", "err"); shakeInput('sp-url'); return; }
  const fmt = $('sp-format').value;
  askFolder(folder => {
    isDownloading = true;
    $('sp-go').disabled = true;
    showPolice();
    pyApi.download_spotify(url, fmt, folder);
  });
};

// Open downloads
$('btn-downloads').onclick = () => pyApi.open_downloads();

// Enter key
$('yt-url').addEventListener('keydown', e => { if (e.key === 'Enter') $('yt-go').click(); });
$('sp-url').addEventListener('keydown', e => { if (e.key === 'Enter') $('sp-go').click(); });

// Exposed to Python
window.addLog = addLog;
window.setStatus = setStatus;
window.setProgress = setProgress;
window.downloadFinished = (success) => {
  isDownloading = false;
  $('yt-go').disabled = false;
  $('sp-go').disabled = false;
  hidePolice(success !== false);
};

// Wizard
function showSlide(n){
  document.querySelectorAll('.wiz-slide').forEach(s => s.classList.remove('active'));
  document.querySelector(`.wiz-slide[data-step="${n}"]`).classList.add('active');
}
function initWizard(){
  if (localStorage.getItem('mdt_no_wizard') === '1') return;
  $('wizard').classList.add('visible');
  showSlide(1);
}
document.querySelector('.wiz-slide[data-step="1"] .wiz-btn').onclick = () => showSlide(2);
document.querySelector('.wiz-slide[data-step="2"] .wiz-yes').onclick = () => showSlide(3);
document.querySelector('.wiz-slide[data-step="2"] .wiz-no').onclick = () => showSlide(1);
document.querySelector('.wiz-slide[data-step="3"] .wiz-open').onclick = () => {
  if ($('wiz-no-show').checked) localStorage.setItem('mdt_no_wizard', '1');
  $('wizard').classList.remove('visible');
};

// pywebview ready
window.addEventListener('pywebviewready', async () => {
  pyApi = window.pywebview.api;
  const tools = await pyApi.check_tools();
  defaultFolder = tools.default_folder;
  addLog("Herramientas detectadas:");
  addLog("  yt-dlp: " + (tools.ytdlp ? "OK" : "FALTA"));
  addLog("  spotdl: " + (tools.spotdl ? "OK" : "FALTA"));
  addLog("  ffmpeg: " + (tools.ffmpeg ? "OK" : "FALTA"));
  if (!tools.ytdlp) addLog("No se encuentra yt-dlp.exe", "err");
  if (!tools.spotdl) addLog("No se encuentra spotdl.exe", "err");
  addLog("Listo para descargar.");
  initWizard();
});
</script>
</body>
</html>
